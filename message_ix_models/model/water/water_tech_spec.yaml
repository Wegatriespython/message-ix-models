# Water Module Technology Groupings for Reporting
# Hierarchical structure defining commodity flows from sources through transformations to demands
# Only defines the technology hierarchy; MESSAGE variables are generated by caller specifying var types

extraction:
  freshwater:
    groundwater:
      renewable:
        - extract_groundwater
      fossil:
        - extract_gw_fossil
    surface_water:
      - extract_surfacewater
  saline:
    desalination_source:
      - extract_salinewater_basin
    cooling_source:
      - extract_salinewater_cool

desalination:
  membrane:
    - membrane
  distillation:
    - distillation

transfer:
  urban:
    - urban_t_d
  rural:
    - rural_t_d
  basin_to_region:
    - basin_to_reg

withdrawal:
  municipal:
    urban:
      connected:
        - urban_t_d
      unconnected:
        - urban_unconnected
    rural:
      connected:
        - rural_t_d
      unconnected:
        - rural_unconnected
  industrial:
    unconnected:
      - industry_unconnected
  irrigation:
    cereal:
      - irrigation_cereal
    oilcrops:
      - irrigation_oilcrops
    sugarcrops:
      - irrigation_sugarcrops

wastewater:
  collection:
    urban:
      - urban_sewerage
    rural:
      - rural_sewerage
  treatment:
    urban:
      - urban_recycle
    rural:
      - rural_recycle
  reuse:
    urban:
      - urban_recycle
    rural:
      - rural_recycle

environmental:
  surface_return:
    - return_flow
  groundwater_recharge:
    - gw_recharge
